name: 📺 YouTube

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos from RSS
        run: |
          python3 -c "
import xml.etree.ElementTree as ET
import urllib.request
import re

feed_url = 'https://www.youtube.com/feeds/videos.xml?channel_id=UCSm3rF8rQ7ftp8hZ7tvqiaw'
feed = urllib.request.urlopen(feed_url).read()
root = ET.fromstring(feed)
ns = {'atom': 'http://www.w3.org/2005/Atom'}
entries = root.findall('atom:entry', ns)[:3]

videos_html = ''
for entry in entries:
    title = entry.find('atom:title', ns).text
    link = entry.find('atom:link', ns).attrib['href']
    video_id = link.split('v=')[-1]
    published = entry.find('atom:published', ns).text[:10]
    escaped_title = title.replace(\"'\", '')
    videos_html += f'''<a href='{link}'><img width='250' src='https://img.youtube.com/vi/{video_id}/mqdefault.jpg' alt='{escaped_title}' title='{escaped_title}'></a>
'''

new_section = '<!-- YOUTUBE:START -->\n<p align=\"center\">\n' + videos_html + '</p>\n<!-- YOUTUBE:END -->'

with open('README.md', 'r') as f:
    content = f.read()

content = re.sub(
    r'<!-- YOUTUBE:START -->.*?<!-- YOUTUBE:END -->',
    new_section,
    content,
    flags=re.DOTALL
)

with open('README.md', 'w') as f:
    f.write(content)

print('Videos fetched and README updated')
"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📺 update latest YouTube videos"
          git push
